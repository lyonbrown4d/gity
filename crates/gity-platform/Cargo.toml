[package]
name = "gity-platform"
version.workspace = true
edition.workspace = true

[features]
default = ["packages", "oci"]
packages = ["dep:gity-package-registry","dep:gity-artifacts", "dep:semver", "dep:pep440_rs", "dep:quick-xml", "dep:flate2", "dep:tar", "dep:zip"]
oci = ["dep:gity-oci", "dep:gity-authority"]

[dependencies]
gity-observability = { path = "../gity-observability" }
gity-package-registry = { path = "../gity-package-registry", optional = true }
libc = "0.2"
toml.workspace = true
gity-git-cluster = { path = "../gity-git-cluster" }
gity-oci = { path = "../gity-oci", optional = true }
gity-authority = { path = "../gity-authority", optional = true }
gity-runtime = { path = "../gity-runtime" }
async-trait.workspace = true
subtle.workspace = true
zip = { workspace = true, optional = true }
tar = { workspace = true, optional = true }
flate2 = { workspace = true, optional = true }
quick-xml = { workspace = true, optional = true }
pep440_rs = { workspace = true, optional = true }
semver = { workspace = true, optional = true }
gity-artifacts = { path = "../gity-artifacts", optional = true }
gity-identity = { path = "../gity-identity" }
gity-entities = { path = "../gity-entities" }
gity-core = { path = "../gity-core" }
gity-git = { path = "../gity-git" }
gity-search = { path = "../gity-search" }
anyhow.workspace = true
axum.workspace = true
base64.workspace = true
bytes.workspace = true
chrono.workspace = true
sea-orm.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tower.workspace = true
tower-http.workspace = true
tracing.workspace = true
uuid.workspace = true
fluxdi.workspace = true
serde_yaml = { package = "serde_yaml_ng", version = "0.10" }
argon2 = { version = "0.6", features = ["getrandom"] }
sha2 = "0.10"
hex = "0.4"
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.13", features = ["json", "multipart"] }
regex = "1"
russh = "=0.65.0"
rand = "0.10"
glob = "0.3"
deunicode = "1"
utoipa = { version = "6", features = ["axum_extras", "chrono", "uuid"] }
utoipa-axum = "0.3"
utoipa-swagger-ui = { version = "10", default-features = false, features = ["axum", "vendored"] }
futures-util = "0.3"
metrics = "0.24"
tracing-subscriber = { workspace = true, features = ["json"] }

[dev-dependencies]
tempfile.workspace = true
tower.workspace = true
reqwest = { version = "0.13", features = ["blocking", "json"] }
