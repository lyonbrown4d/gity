[package]
name = "gity-observability"
version.workspace = true
edition.workspace = true

[dependencies]
anyhow.workspace = true
axum.workspace = true
serde.workspace = true
tracing.workspace = true
uuid.workspace = true
url = "2"
metrics = "0.24"
metrics-exporter-prometheus = "0.18"
