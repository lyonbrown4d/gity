[package]
name = "gity-oci"
version.workspace = true
edition.workspace = true

[dependencies]
gity-observability = { path = "../gity-observability" }
async-trait = "0.1"
axum.workspace = true
futures-util = "0.3"
http-body-util = "0.1"
http-body = "1"
fluxdi = { version = "=2.0.0", features = ["thread-safe", "lifecycle"] }
http = "1"
oci-client = { git = "https://github.com/oras-project/rust-oci-client.git", rev = "a913569b1918ea1fda72ed3ba3711b93dea9100f", default-features = false }
reqwest = { version = "0.13", features = ["stream"] }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
url = "2"
tower = { version = "0.5", features = ["util"] }

[dev-dependencies]
reqwest = { version = "0.13", features = ["json"] }
