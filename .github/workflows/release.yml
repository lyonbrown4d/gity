name: Release
on:
  push:
    tags: ["v*"]
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  verify:
    uses: ./.github/workflows/ci.yml
  archive:
    needs: verify
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux-amd64
          - runner: ubuntu-24.04-arm
            platform: linux-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - run: pnpm --dir web install --frozen-lockfile
      - run: cargo run -p gity-server --locked -- openapi --output web/openapi.json
      - run: pnpm --dir web gen:api
      - run: pnpm --dir web test
      - run: pnpm --dir web build
      - run: cargo xtask release
      - name: Package Rust binaries and Web assets
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          mkdir -p package/dist
          cp target/release/gity-server target/release/gity-standalone target/release/gity-api target/release/gity-git-server target/release/gity-worker target/release/gity-git-node target/release/gity-registry target/release/gity-gateway target/release/gity-runner target/release/gity-git-hook target/release/gity-search-index package/
          cp -R dist/web package/dist/web
          cp LICENSE package/
          tar -czf "gity-${GITHUB_REF_NAME}-${PLATFORM}.tar.gz" -C package .
          sha256sum "gity-${GITHUB_REF_NAME}-${PLATFORM}.tar.gz" > "gity-${GITHUB_REF_NAME}-${PLATFORM}.tar.gz.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: archive-${{ matrix.platform }}
          path: gity-*.tar.gz*
  publish:
    needs: archive
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          pattern: archive-*
          merge-multiple: true
      - name: Publish release archives
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" gity-*.tar.gz* --verify-tag --generate-notes
  images:
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        role: [standalone, git, api, git-node, gateway, registry, runner, worker]
        base: [debian, alpine]
        include:
          - base: debian
            builder: rust:1.99.1-bookworm
            runtime: debian:bookworm-slim
          - base: alpine
            builder: rust:1.99.1-alpine
            runtime: alpine:3.22
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: build/package/Dockerfile.variants
          target: ${{ matrix.role }}
          platforms: linux/amd64,linux/arm64
          build-args: |
            GITY_ROLE=${{ matrix.role }}
            GITY_BASE=${{ matrix.base }}
            BUILDER_IMAGE=${{ matrix.builder }}
            RUNTIME_IMAGE=${{ matrix.runtime }}
          cache-from: type=gha,scope=${{ matrix.role }}-${{ matrix.base }}
          cache-to: type=gha,mode=max,scope=${{ matrix.role }}-${{ matrix.base }}
          push: true
          tags: ghcr.io/${{ github.repository }}-${{ matrix.role }}:${{ github.ref_name }}-${{ matrix.base }}
