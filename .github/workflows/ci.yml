name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: always
jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - run: cargo install mdbook --version 0.5.4 --locked
      - run: cargo xtask docs
      - uses: actions/upload-artifact@v4
        with:
          name: gity-mdbook
          path: target/book
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - run: cargo xtask source-check
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo check -p gity-web --target wasm32-unknown-unknown --locked
      - run: cargo install trunk --version 0.21.14 --locked
      - run: cargo xtask release
      - uses: actions/upload-artifact@v4
        with:
          name: rust-linux-smoke-build
          path: |
            target/release/gity-server
            target/release/gity-standalone
            target/release/gity-api
            target/release/gity-git-server
            target/release/gity-worker
            target/release/gity-git-node
            target/release/gity-registry
            target/release/gity-gateway
            target/release/gity-runner
            target/release/gity-git-hook
            target/release/gity-search-index
            dist/web
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - name: Start disposable database and S3 services
        run: |
          docker compose -f deploy/integration/compose.yaml --profile ci up -d --wait --wait-timeout 180 postgres-test mysql-test s3
          docker compose -f deploy/integration/compose.yaml run --rm s3-init
      - name: Isolated Testcontainers entity contracts
        run: cargo test -p gity-entities --test container_databases --locked -- --ignored --test-threads=1
      - name: PostgreSQL API regression
        env:
          GITY_TEST_DATABASE_URL: postgres://gity:gity-test-db-only@localhost:5434/gity
        run: cargo test -p gity-platform -p gity-server --locked -- --test-threads=1
      - name: MySQL API regression
        env:
          GITY_TEST_DATABASE_URL: mysql://root:gity-test-root-only@localhost:3308/gity
        run: cargo test -p gity-platform -p gity-server --locked -- --test-threads=1
      - name: SeaweedFS S3 contract
        env:
          GITY_TEST_S3_ENDPOINT: http://localhost:9000
        run: cargo test -p gity-core seaweedfs_s3_contract --locked
      - name: Integration service logs
        if: failure()
        run: docker compose -f deploy/integration/compose.yaml --profile ci logs --no-color --tail=100
      - name: Remove disposable integration data
        if: always()
        run: docker compose -f deploy/integration/compose.yaml --profile ci down --volumes
