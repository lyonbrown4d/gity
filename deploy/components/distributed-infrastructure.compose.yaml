services:
  opensearch:
    image: public.ecr.aws/opensearchproject/opensearch:3.9.0
    environment:
      discovery.type: single-node
      bootstrap.memory_lock: "true"
      OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
      OPENSEARCH_INITIAL_ADMIN_PASSWORD: ${OPENSEARCH_INITIAL_ADMIN_PASSWORD:?Set a strong OpenSearch administrator password}
      plugins.security.ssl.http.enabled: "false"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent --user \"admin:$$OPENSEARCH_INITIAL_ADMIN_PASSWORD\" http://localhost:9200/_cluster/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s
    restart: unless-stopped

  postgres:
    image: postgres:18.1-alpine
    environment:
      POSTGRES_DB: gity
      POSTGRES_USER: gity
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a random database password}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gity -d gity"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  seaweed:
    image: chrislusf/seaweedfs:4.51
    command: ["mini", "-dir=/data", "-ip=seaweed", "-s3", "-s3.config=/etc/seaweedfs/s3.json"]
    volumes:
      - seaweed-data:/data
      - ${GITY_SECRETS_DIR:-./secrets}/seaweed-s3.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "-T", "3", "http://127.0.0.1:9333/cluster/status"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  seaweed-buckets:
    image: amazon/aws-cli:2.27.41
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        for bucket in gity-artifacts gity-oci; do
          if ! aws --endpoint-url http://seaweed:8333 s3api head-bucket --bucket "$$bucket" >/dev/null 2>&1; then
            aws --endpoint-url http://seaweed:8333 s3api create-bucket --bucket "$$bucket";
          fi;
        done
    environment:
      AWS_ACCESS_KEY_ID: ${SEAWEED_ACCESS_KEY_ID:?Set the SeaweedFS access key}
      AWS_SECRET_ACCESS_KEY: ${SEAWEED_SECRET_KEY:?Set the SeaweedFS secret key}
      AWS_DEFAULT_REGION: us-east-1
    depends_on:
      seaweed:
        condition: service_healthy
    restart: "no"
