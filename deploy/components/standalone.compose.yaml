x-outbound-proxy-environment: &outbound-proxy-environment
  HTTP_PROXY: ${GITY_OUTBOUND_HTTP_PROXY:-}
  HTTPS_PROXY: ${GITY_OUTBOUND_HTTPS_PROXY:-}
  NO_PROXY: ${GITY_OUTBOUND_NO_PROXY:-localhost,127.0.0.1,::1,gity,api,git-server,git-node,git-node-2,gateway,registry,worker,runner,seaweed,postgres,docker}

services:
  gity:
    image: ${GITY_STANDALONE_IMAGE:?Set a local or published versioned standalone image name}
    build:
      context: ../..
      dockerfile: build/package/Dockerfile.variants
      target: standalone
      args:
        GITY_ROLE: standalone
        GITY_BASE: ${GITY_BASE:-debian}
        BUILDER_IMAGE: ${GITY_BUILDER_IMAGE:-rust:1.99.1-bookworm}
        RUNTIME_IMAGE: ${GITY_RUNTIME_IMAGE:-debian:bookworm-slim}
    command: ["--config", "/etc/gity/gity.toml", "standalone"]
    environment:
      <<: *outbound-proxy-environment
      GITY_COMPONENTS__AUTHORITY__TOKEN: ${AUTHORITY_PEER_TOKEN:?Set a random authority peer token}
      GITY_COMPONENTS__RUNNER__WORK_ROOT: ${GITY_RUNNER_HOST_WORK_ROOT:?Create a host work directory and set its absolute path}
      DOCKER_HOST: tcp://docker:2376
      DOCKER_TLS_VERIFY: "1"
      DOCKER_CERT_PATH: /certs/client
    ports:
      - "${GITY_HTTP_PORT:-8080}:8080"
      - "${GITY_SSH_PORT:-2222}:2222"
      - "${GITY_OCI_PORT:-5000}:5000"
    volumes:
      - gity-data:/var/lib/gity
      - docker-certs:/certs:ro
      - type: bind
        source: ${GITY_RUNNER_HOST_WORK_ROOT:?Create a host work directory and set its absolute path}
        target: ${GITY_RUNNER_HOST_WORK_ROOT:?Create a host work directory and set its absolute path}
      - ./config/standalone.toml:/etc/gity/gity.toml:ro
    depends_on:
      docker:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/api/health"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 30s

  docker:
    image: docker:28.5-dind
    privileged: true
    environment:
      <<: *outbound-proxy-environment
      DOCKER_TLS_CERTDIR: /certs
    volumes:
      - docker-data:/var/lib/docker
      - docker-certs:/certs
      - type: bind
        source: ${GITY_RUNNER_HOST_WORK_ROOT:?Create a host work directory and set its absolute path}
        target: ${GITY_RUNNER_HOST_WORK_ROOT:?Create a host work directory and set its absolute path}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "docker", "info"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  gity-data:
  docker-data:
  docker-certs:
