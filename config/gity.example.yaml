http:
  address: 0.0.0.0:8080
  base_url: http://localhost:8080
database:
  driver: sqlite
  dsn: sqlite://data/gity.db?mode=rwc
  node_id: 1
git:
  repo_root: data/repos
  bin: git
ssh:
  enabled: false
  address: 0.0.0.0:2222
  host_key: data/ssh_host_ed25519
  max_connections: 64
  operation_timeout_seconds: 900
storage:
  driver: local
  root: data/storage
  s3_bucket: gity
  s3_endpoint: http://localhost:9000
  s3_region: us-east-1
  s3_access_key: ""
  s3_secret_key: ""
  s3_use_path_style: true
web:
  root: dist/web
search:
  index_enabled: true
  index_root: data/search-index
  refresh_interval_seconds: 300
  max_files_per_project: 5000
  max_file_size_bytes: 524288
observability:
  service_name: gity-server
  log_format: json
  log_level: gity=info,tower_http=info
  metrics_enabled: true
  metrics_address: 127.0.0.1:9090
  otlp_endpoint: ""
bootstrap:
  enabled: true
  username: root
  # Supply a private input file instead of logging or passing a password in CLI arguments.
  # initial_password_file: /run/secrets/gity_root_password
api:
  graphql_enabled: true
  mcp_enabled: true
  graphql_introspection: false
  graphql_max_depth: 12
  graphql_max_complexity: 200
  max_request_bytes: 1048576
  mcp_max_concurrent_requests: 64
  mcp_request_timeout_seconds: 30
  mcp_allowed_origins: []
  mcp_allowed_hosts: []
oauth:
  authorization_code_ttl_seconds: 600
  access_token_ttl_seconds: 3600
  refresh_token_ttl_seconds: 2592000
  pending_request_ttl_seconds: 300
  max_dynamic_clients: 1000
