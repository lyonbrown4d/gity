version: "2"

run:
  timeout: 20m
  go: "1.26.1"

linters:
  default: none
  enable:
    - asasalint
    - bodyclose
    - contextcheck
    - copyloopvar
    - cyclop
    - dupl
    - errcheck
    - errorlint
    - exhaustive
    - exptostd
    - fatcontext
    - funlen
    - gochecksumtype
    - gocognit
    - gocritic
    - gocyclo
    - godoclint
    - gosec
    - govet
    - ineffassign
    - intrange
    - makezero
    - misspell
    - modernize
    - nestif
    - nilerr
    - nilnesserr
    - nilnil
    - noctx
    - nolintlint
    - perfsprint
    - prealloc
    - revive
    - rowserrcheck
    - sqlclosecheck
    - thelper
    - unconvert
    - unparam
    - unused
    - usestdlibvars
    - usetesting
    - wastedassign
    - wrapcheck
    - sloglint
    - spancheck
    - staticcheck
    - tagalign
    - testpackage
    - unqueryvet
  settings:
    cyclop:
      max-complexity: 10
    errcheck:
      check-type-assertions: true
      check-blank: true
      disable-default-exclusions: true
    errorlint:
      errorf: true
      errorf-multi: true
      asserts: true
      comparison: true
    exhaustive:
      check:
        - switch
        - map
      default-signifies-exhaustive: false
      package-scope-only: true
      explicit-exhaustive-switch: false
      explicit-exhaustive-map: false
      default-case-required: false
    funlen:
      lines: 80
      statements: 40
      ignore-comments: false
    gochecksumtype:
      default-signifies-exhaustive: false
      include-shared-interfaces: true
    gocognit:
      min-complexity: 10
    gocritic:
      enable-all: true
      disabled-checks:
        - commentedOutCode
        - hugeParam
        - unnamedResult
    gocyclo:
      min-complexity: 10
    godoclint:
      default: basic
      options:
        start-with-name:
          include-unexported: false
    govet:
      enable-all: true
      disable:
        - fieldalignment
    misspell:
      locale: US
    nolintlint:
      allow-unused: false
      require-specific: true
      require-explanation: true
    perfsprint:
      int-conversion: true
      err-error: true
      errorf: true
      sprintf1: true
      strconcat: true
    revive:
      confidence: 0.8
      enable-default-rules: true
      rules:
        - name: file-length-limit
          arguments:
            - max: 300
              skip-comments: false
              skip-blank-lines: false
        - name: exported
          disabled: true
        - name: unexported-return
          disabled: true
        - name: unused-parameter
          disabled: true
    staticcheck:
      checks:
        - all
        - -ST1000
    wrapcheck:
      extra-ignore-sigs:
        - github.com/samber/oops.New(
        - github.com/samber/oops.Errorf(
        - github.com/samber/oops.Wrap(
        - github.com/samber/oops.Wrapf(
        - github.com/samber/oops.Join(
        - (github.com/samber/oops.OopsErrorBuilder).New(
        - (github.com/samber/oops.OopsErrorBuilder).Errorf(
        - (github.com/samber/oops.OopsErrorBuilder).Wrap(
        - (github.com/samber/oops.OopsErrorBuilder).Wrapf(
        - (github.com/samber/oops.OopsErrorBuilder).Join(
        - github.com/DaiYuANg/gity/internal/infrastructure/persistence.One(
        - github.com/DaiYuANg/gity/internal/infrastructure/persistence.Many(
        - github.com/DaiYuANg/gity/internal/infrastructure/persistence.NormalizeError(
        - github.com/DaiYuANg/gity/internal/infrastructure/persistence.One[
        - github.com/DaiYuANg/gity/internal/infrastructure/persistence.Many[
        - persistence.One(
        - persistence.Many(
        - persistence.NormalizeError(
        - persistence.One[
        - persistence.Many[
      ignore-package-globs:
        - github.com/DaiYuANg/gity/internal/application/*
        - github.com/DaiYuANg/gity/internal/application/**
        - github.com/DaiYuANg/gity/internal/interfaces/http_api
        - github.com/DaiYuANg/gity/internal/infrastructure/auth
        - github.com/gofiber/fiber/v2
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - godoclint
      - path: _test\.go
        text: "G204:"
        linters:
          - gosec
      - path: internal[\\/]infrastructure[\\/]git_exec[\\/]runner\.go
        text: "G204:"
        linters:
          - gosec
      - path: internal[\\/]infrastructure[\\/]runner_agent[\\/]executor\.go
        text: "G204:"
        linters:
          - gosec

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  uniq-by-line: false
