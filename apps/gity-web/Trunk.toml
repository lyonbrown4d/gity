[build]
target = "index.html"
dist = "../../dist/web"
public_url = "/"

[serve]
addresses = ["127.0.0.1"]
port = 5173

# `trunk serve` serves the bundle with hot reload and forwards the JSON API to the
# platform server on 8080. Trunk 0.22 cannot proxy a backend mounted at the root,
# so Git over HTTP and LFS are exercised against the platform server directly.
[[proxies]]
backend = "http://127.0.0.1:8080/api"
ws = false
