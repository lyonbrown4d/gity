[build]
target = "index.html"
dist = "../../dist/web"
public_url = "/"

[serve]
addresses = ["127.0.0.1"]
port = 5173

# `trunk serve` is the development loop: it serves the bundle with hot reload and
# forwards API, Git and LFS requests to the platform server on 8080.
[[proxies]]
backend = "http://127.0.0.1:8080"
ws = false
