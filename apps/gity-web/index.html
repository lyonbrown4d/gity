  <style>
    #boot{position:fixed;inset:0;display:flex;background:#f8fafc;z-index:9999}
    #boot .boot-rail{width:64px;background:#eef2f7;border-right:1px solid #e2e8f0}
    #boot .boot-main{flex:1;padding:32px;display:grid;gap:16px;align-content:start}
    #boot .boot-line,#boot .boot-card{background:linear-gradient(90deg,#e9eef5 25%,#f4f7fb 37%,#e9eef5 63%);background-size:400% 100%;animation:boot-shimmer 1.4s ease infinite}
    #boot .boot-line{height:14px;border-radius:7px;width:min(520px,60%)}
    #boot .boot-title{width:220px;height:22px}
    #boot .boot-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px;margin-top:16px}
    #boot .boot-card{height:104px;border-radius:10px}
    @keyframes boot-shimmer{0%{background-position:100% 0}100%{background-position:0 0}}
    body:has(.thaw-config-provider) #boot{display:none}
    @media (prefers-color-scheme:dark){#boot{background:#0b1220}#boot .boot-rail{background:#0f172a;border-color:#1e293b}#boot .boot-line,#boot .boot-card{background:linear-gradient(90deg,#1e293b 25%,#273449 37%,#1e293b 63%);background-size:400% 100%}}
  </style>
</head>
<body>
  <div id="boot" aria-busy="true" aria-label="Loading Gity">
    <aside class="boot-rail"></aside>
    <main class="boot-main">
      <div class="boot-line boot-title"></div>
      <div class="boot-line"></div>
      <div class="boot-cards">
        <div class="boot-card"></div>
        <div class="boot-card"></div>
        <div class="boot-card"></div>
      </div>
    </main>
  </div>
  <noscript>Gity requires JavaScript to run its Rust WebAssembly application.</noscript>
</body>
