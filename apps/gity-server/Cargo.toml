[package]
name = "gity-server"
version.workspace = true
edition.workspace = true

[features]
api-docs = ["gity-platform/api-docs"]

[dependencies]
gity-platform = { path = "../../crates/gity-platform" }
gity-core = { path = "../../crates/gity-core" }
gity-git = { path = "../../crates/gity-git" }
anyhow.workspace = true
tokio.workspace = true
tracing.workspace = true
fluxdi.workspace = true
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
gity-core = { path = "../../crates/gity-core", features = ["test-fixtures"] }
hex = "0.4"
rand = "0.10"
tempfile.workspace = true
tower.workspace = true
axum.workspace = true
base64.workspace = true
bytes.workspace = true
chrono.workspace = true
sea-orm.workspace = true
serde_json.workspace = true
tokio-util.workspace = true
uuid.workspace = true
sha2.workspace = true
russh = "=0.65.0"
reqwest = { version = "0.13", features = ["blocking", "json"] }
