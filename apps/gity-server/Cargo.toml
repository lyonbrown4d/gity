[package]
name = "gity-server"
version.workspace = true
edition.workspace = true

[dependencies]
gity-core = { path = "../../crates/gity-core" }
gity-git = { path = "../../crates/gity-git" }
gity-search = { path = "../../crates/gity-search" }
anyhow.workspace = true
axum.workspace = true
base64.workspace = true
bytes.workspace = true
chrono.workspace = true
sea-orm.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tower.workspace = true
tower-http.workspace = true
tracing.workspace = true
uuid.workspace = true
fluxdi.workspace = true
serde_yaml = { package = "serde_yaml_ng", version = "0.10" }
argon2 = { version = "0.6", features = ["getrandom"] }
sha2 = "0.10"
hex = "0.4"
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.13", features = ["json", "multipart"] }
regex = "1"
russh = "=0.65.0"
rand = "0.10"
glob = "0.3"
deunicode = "1"
utoipa = { version = "6", features = ["axum_extras", "chrono", "uuid"] }
utoipa-axum = "0.3"
utoipa-swagger-ui = { version = "10", default-features = false, features = ["axum", "vendored"] }
futures-util = "0.3"
metrics = "0.24"
metrics-exporter-prometheus = "0.18"
opentelemetry = "0.33"
opentelemetry_sdk = "0.33"
opentelemetry-otlp = { version = "0.33", default-features = false, features = ["trace", "http-proto", "reqwest-blocking-client", "reqwest-rustls"] }
tracing-opentelemetry = "0.34"
tracing-subscriber = { workspace = true, features = ["json"] }

[dev-dependencies]
tempfile.workspace = true
tower.workspace = true
reqwest = { version = "0.13", features = ["blocking", "json"] }
