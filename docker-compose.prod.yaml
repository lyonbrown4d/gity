services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: gity
      MYSQL_USER: gity
      MYSQL_PASSWORD: ${GITY_MYSQL_PASSWORD:-change-me-gity}
      MYSQL_ROOT_PASSWORD: ${GITY_MYSQL_ROOT_PASSWORD:-change-me-root}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -ugity -p$${MYSQL_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - mysql_data:/var/lib/mysql

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${GITY_STORAGE__S3_ACCESS_KEY:-gity}
      MINIO_ROOT_PASSWORD: ${GITY_STORAGE__S3_SECRET_KEY:-change-me-minio}
    volumes:
      - minio_data:/data

  migration:
    image: ghcr.io/daiyuang/gity-migration:${GITY_IMAGE_TAG:-v0.1.0-beta.1}
    profiles: ["migration"]
    env_file:
      - .env.production
    environment:
      GITY_DATABASE__DSN: gity:${GITY_MYSQL_PASSWORD:-change-me-gity}@tcp(mysql:3306)/gity?parseTime=true&multiStatements=true
    depends_on:
      mysql:
        condition: service_healthy
    restart: "no"

  server:
    image: ghcr.io/daiyuang/gity-server:${GITY_IMAGE_TAG:-v0.1.0-beta.1}
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      GITY_DATABASE__DSN: gity:${GITY_MYSQL_PASSWORD:-change-me-gity}@tcp(mysql:3306)/gity?parseTime=true&multiStatements=true
    depends_on:
      mysql:
        condition: service_healthy
      minio:
        condition: service_started
    ports:
      - "${GITY_HTTP_PORT:-8080}:8080"
    volumes:
      - repo_data:/var/lib/gity/repos
      - search_index:/var/lib/gity/search-index
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/api/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10

  worker:
    image: ghcr.io/daiyuang/gity-worker:${GITY_IMAGE_TAG:-v0.1.0-beta.1}
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      GITY_DATABASE__DSN: gity:${GITY_MYSQL_PASSWORD:-change-me-gity}@tcp(mysql:3306)/gity?parseTime=true&multiStatements=true
    depends_on:
      mysql:
        condition: service_healthy
      minio:
        condition: service_started
    volumes:
      - repo_data:/var/lib/gity/repos
      - search_index:/var/lib/gity/search-index

  standalone:
    image: ghcr.io/daiyuang/gity-standalone:${GITY_IMAGE_TAG:-v0.1.0-beta.1}
    profiles: ["standalone"]
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      GITY_DATABASE__DSN: gity:${GITY_MYSQL_PASSWORD:-change-me-gity}@tcp(mysql:3306)/gity?parseTime=true&multiStatements=true
    depends_on:
      mysql:
        condition: service_healthy
      minio:
        condition: service_started
    ports:
      - "${GITY_HTTP_PORT:-8080}:8080"
    volumes:
      - repo_data:/var/lib/gity/repos
      - search_index:/var/lib/gity/search-index

volumes:
  mysql_data:
  minio_data:
  repo_data:
  search_index:
