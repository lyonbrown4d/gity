[workspace]
members = [
  "apps/ci-runner",
  "apps/standalone",
  "crates/application",
  "crates/domain",
  "crates/entity",
  "crates/git",
  "crates/migration",
  "crates/models",
  "crates/platform",
  "crates/repository",
]
resolver = "3"

[workspace.metadata]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
tokio = "1.48.0"
tracing = "0.1.44"
tracing-subscriber = "0.3.22"
serde = "1.0.228"
serde_json = "1.0.147"
clap = "4.5.53"
sea-orm = "2.0.0-rc.34"
sea-orm-migration = "2.0.0-rc.34"
toasty = "0.3.0"
toasty-driver-postgresql = "0.3.0"
validator = "0.20.0"
validator_derive = "0.20.0"
chrono = "0.4.42"
mr-ulid = "2.0.0"
utoipa = "5.4.0"
argon2 = "0.5.3"

