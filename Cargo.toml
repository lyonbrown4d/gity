[workspace]
members = ["crates/gity-core", "crates/gity-git", "crates/gity-i18n", "apps/gity-server", "apps/gity-web", "apps/gity-runner", "apps/gity-git-hook", "crates/gity-search", "apps/gity-search-index", "xtask"]
resolver = "3"

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.99.1"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["multipart", "macros"] }
base64 = "0.22"
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
git2 = "0.21"
sea-orm = { version = "2", default-features = false, features = ["macros", "sqlx-sqlite", "sqlx-postgres", "sqlx-mysql", "runtime-tokio-rustls", "with-json", "with-chrono"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["fs", "trace", "limit"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "v7", "serde"] }
tempfile = "3"
fluxdi = { version = "=2.0.0", features = ["thread-safe", "macros", "tracing"] }

[profile.release]
lto = "thin"
strip = true

# wasm-bindgen/wasm-opt need the target_features section for validation.
[profile.release.package.gity-web]
strip = false
